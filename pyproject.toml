[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "q_compiler"
version = "0.1.0"
description = "A toy relational query compiler and differential execution engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "sqlglot>=20.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ir*", "bench*", "catalog*", "codegen*", "runtime*", "frontend*", "optimizer*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

