[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "q_compiler"
version = "0.1.0"
description = "A toy relational query compiler and differential execution engine"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14.0.0",
    "sqlglot>=20.0.0",
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
